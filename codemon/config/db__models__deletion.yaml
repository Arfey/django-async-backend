pathname: db/models/deletion.py

module:
  new_imports:
    - "from inspect import iscoroutinefunction"
    - "from django.db.models import deletion as django_deletion"
    - "from django.db.models.deletion import ProtectedError"
    - "from django.db.models.deletion import RestrictedError"
    - "from django_async_backend.db import async_connections"
    - "from django_async_backend.db.transaction import async_atomic"
    - "from django_async_backend.db.transaction import async_mark_for_rollback_on_error"
    - "from django_async_backend.db.models import sql"
    - "from django_async_backend.db.models.query import QuerySet"
    - "from django_async_backend.utils.contenttypes import aget_for_model"

  add_raw_bottom:
    - |
      _SYNC_TO_ASYNC_ON_DELETE = {
          django_deletion.CASCADE: CASCADE,
          django_deletion.PROTECT: PROTECT,
          django_deletion.RESTRICT: RESTRICT,
          django_deletion.SET_NULL: SET_NULL,
          django_deletion.SET_DEFAULT: SET_DEFAULT,
          django_deletion.DO_NOTHING: DO_NOTHING,
      }
    - |
      def _resolve_async_on_delete(on_delete):
          handler = _SYNC_TO_ASYNC_ON_DELETE.get(on_delete)

          if handler is not None:
              return handler

          deconstruct = getattr(on_delete, "deconstruct", None)

          if deconstruct is not None:
              path, args, kwargs = deconstruct()
              if path == "django.db.models.SET":
                  return SET(*args, **kwargs)
          if iscoroutinefunction(on_delete):
              return on_delete
          raise TypeError(
              "async delete does not support the synchronous on_delete handler "
              f"{on_delete!r}. Use a standard Django on_delete or an async "
              "callable."
          )
    - |
      async def _abulk_related_objects(field, objs, using):
          from django.contrib.contenttypes.fields import GenericRelation

          if not isinstance(field, GenericRelation):  # pragma: no cover
              raise TypeError(
                  "async delete does not support bulk_related_objects() on "
                  f"{field!r}. Only contenttypes' GenericRelation is "
                  "implemented."
              )

          content_type = await aget_for_model(
              field.model, using, field.for_concrete_model
          )
          return field.remote_field.model._async_base_manager.using(
              using
          ).filter(
              **{
                  f"{field.content_type_field_name}__pk": content_type.pk,
                  f"{field.object_id_field_name}__in": [
                      obj.pk for obj in objs
                  ],
              }
          )

  import_aliases:
    - name: IntegrityError
      remove: true
    - name: connections
      remove: true
    - name: transaction
      remove: true
    - name: models
      remove: true
    - name: sql
      remove: true

  functions:
    CASCADE:
      to_async: true
      attrs:
        - name: connections
          rename:
            name: async_connections
      calls:
        - func:
            attr: collect
          to_await: true

    PROTECT:
      to_async: true
      # sub_objs is an async queryset: the error message indexes it and
      # collect() extends a list with error.protected_objects.
      add_raw_top:
        - "sub_objs = [obj async for obj in sub_objs]"

    RESTRICT:
      to_async: true
      # add_restricted_objects() indexes and iterates sub_objs synchronously.
      add_raw_top:
        - "sub_objs = [obj async for obj in sub_objs]"

    SET:
      functions:
        set_on_delete:
          to_async: true

    SET_NULL:
      to_async: true

    SET_DEFAULT:
      to_async: true

    DO_NOTHING:
      to_async: true

  classes:
    ProtectedError:
      remove: true

    RestrictedError:
      remove: true

    Collector:
      methods:
        get_del_batches:
          attrs:
            - name: connections
              rename:
                name: async_connections

        can_fast_delete:
          # on_delete holds Django's sync handlers, which never compare equal
          # to the async CASCADE/DO_NOTHING defined here.
          attrs:
            - attr: on_delete
              parent_attr: remote_field
              wrap: _resolve_async_on_delete

        related_objects:
          attrs:
            - name: _base_manager
              rename:
                name: _async_base_manager

        clear_restricted_objects_from_queryset:
          to_async: true
          attrs:
            - value: qs
              attr: filter
              to_async_comp: obj

        collect:
          to_async: true
          attrs:
            - attr: on_delete
              parent_attr: remote_field
              wrap: _resolve_async_on_delete
          boolean_operations:
            - operands:
                - name: sub_objs
                  to_call_method:
                    name: aexists
                  to_await: true
          calls:
            # add() indexes and iterates objs, which the sync collector gets
            # for free from the queryset result cache.
            - func:
                value: self
                attr: add
              replace_raw: |
                self.add(
                    (
                        [obj async for obj in objs]
                        if isinstance(objs, QuerySet)
                        else objs
                    ),
                    source,
                    nullable,
                    reverse_dependency=reverse_dependency,
                )
            - func:
                value: sub_objs
                attr: only
                rename:
                  attr: _only
            - func:
                value: field
                attr: bulk_related_objects
              replace_raw: |
                await _abulk_related_objects(field, new_objs, self.using)
            - func:
                attr: collect
              to_await: true
            - func:
                attr: clear_restricted_objects_from_queryset
              to_await: true
            - func:
                name: on_delete
              to_await: true

        delete:
          to_async: true
          context_managers:
            - to_async: true
          attrs:
            - value: models
              attr: QuerySet
              rename:
                name: QuerySet
          calls:
            - func:
                value: transaction
                attr: mark_for_rollback_on_error
                rename:
                  name: async_mark_for_rollback_on_error
            - func:
                value: transaction
                attr: atomic
                rename:
                  name: async_atomic
            - func:
                attr: send
                rename:
                  attr: asend
              to_await: true
            - func:
                attr: _raw_delete
              to_await: true
            - func:
                attr: update
                rename:
                  attr: aupdate
              to_await: true
            - func:
                attr: update_batch
              to_await: true
            - func:
                attr: delete_batch
              to_await: true
